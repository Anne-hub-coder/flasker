name: Build, scan, and publish Flasker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: |
            anushkaag10/flasker:latest
            anushkaag10/flasker:${{ github.sha }}

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: anushkaag10
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Scan for fixable critical and high vulnerabilities
        if: github.ref == 'refs/heads/main'
        uses: docker/scout-action@v1
        with:
          command: cves
          image: local://anushkaag10/flasker:latest
          only-fixed: true
          only-severities: critical,high
          exit-code: true

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          docker push anushkaag10/flasker:latest
          docker push anushkaag10/flasker:${{ github.sha }}

